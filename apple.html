<h1>🍎 Apple Juice</h1>

<h2>Ingredients</h2>

<ul>
<li>Apple</li>
<li>Milk</li>
<li>Sugar</li>
<li>Ice cubes</li>
</ul>

<h2>Instructions</h2>

<p>
1. Wash and cut the apple.<br>
2. Add apple, milk and sugar into a blender.<br>
3. Blend until smooth.<br>
4. Serve chilled.
