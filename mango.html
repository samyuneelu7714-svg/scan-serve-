<!DOCTYPE html>
<html>
<head>
    <title>Mango Recipe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🥭 Mango Juice</h1>

<img src="images/mango.jpg" width="300">

<h2>Ingredients</h2>

<ul>
    <li>Mango</li>
    <li>Milk</li>
    <li>Sugar</li>
    <li>Ice cubes</li>
</ul>

<h2>Instructions</h2>

<p>
1. Peel and cut the mango.<br>
2. Add mango, milk and sugar into a blender.<br>
3. Blend until smooth.<br>
4. Add ice cubes and serve chilled.
</p>

</div>

</body>
</html>
