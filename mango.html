<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Recipe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="recipe-card">

    <h1>🥭 Mango Juice</h1>

    <img src="images/mango.jpg" alt="Mango Juice" class="recipe-img">

    <h2>Ingredients</h2>

    <ul>
        <li>2 Ripe Mangoes</li>
        <li>1 Cup Milk</li>
        <li>2 tbsp Sugar</li>
        <li>Ice Cubes</li>
    </ul>

    <h2>Instructions</h2>

    <p>
        Blend all ingredients until smooth.<br><br>
        Pour into a glass.<br><br>
        Serve chilled and enjoy!
    </p>

</div>

</body>
</html>
